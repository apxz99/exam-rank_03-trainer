<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Powerset: Backtracking</title><style>
:root{color-scheme:dark;--bg:#0d0f13;--line:#2a2f38;--text:#e6e8ec;--muted:#8d939f}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}body{display:grid;place-items:center;font:14px system-ui,sans-serif}.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;cursor:pointer}canvas{display:block;width:100%;height:100%}.progress{position:absolute;inset:auto 0 0;height:3px;width:0;background:#8d939f;opacity:.65}.fullscreen{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#101319cc;color:var(--muted);cursor:pointer}.fullscreen:hover,.fullscreen:focus-visible{color:var(--text);border-color:var(--muted);outline:none}.fullscreen svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><div class="stage" id="stage"><canvas id="canvas" width="1280" height="720" aria-label="แอนิเมชันการทำงานของ powerset"></canvas><div class="progress" id="progress"></div><button class="fullscreen" id="fullscreen" title="เต็มจอ" aria-label="เต็มจอ"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div><script>
(()=>{'use strict';const c=document.getElementById('canvas'),g=c.getContext('2d'),prog=document.getElementById('progress'),stage=document.getElementById('stage'),W=1280,H=720,C={bg:'#0d0f13',panel:'#13161c',code:'#0a0c10',line:'#2a2f38',edge:'#3a404c',text:'#e6e8ec',muted:'#8d939f',faint:'#4b515c',ok:'#4ade80',purple:'#a78bfa',hot:'#232833'},set=[1,2,3],target=3,nodes={},beats=[],shots=[],seen=new Set(['r']),output=[];
function build(id,d,pick,index,parent,branch){const span=2**(set.length-d),x=80+(index*span+(span-1)/2)*110;nodes[id]={id,d,pick,index,parent,branch,x,y:132+d*106,sum:pick.reduce((a,b)=>a+b,0)};if(d<set.length){build(id+'L',d+1,[...pick,set[d]],index*2,id,'เลือก');build(id+'R',d+1,pick,index*2+1,id,'ข้าม')}}build('r',0,[],0,null,'เริ่ม');
function add(kind,id,seconds,line,note){beats.push({kind,id,seconds,line,note});shots.push({seen:new Set(seen),output:[...output]})}add('intro','r',2.2,0,'โจทย์: เลือก subset ที่ผลรวมเท่ากับ 3');function visit(id){const n=nodes[id];if(n.d===set.length){const ok=n.sum===target;if(ok)output.push(n.pick.join(' '));add(ok?'print':'leaf',id,ok?2.2:1.1,ok?13:10,ok?`sum == ${target} → print`:`sum = ${n.sum} → return`);return}for(const side of['L','R']){const child=id+side;seen.add(child);add('call',child,1.25,side==='L'?18:20,side==='L'?`เลือก ${set[n.d]}`:`ข้าม ${set[n.d]}`);visit(child);add('return',id,.7,21,'return ไปยังชั้นก่อนหน้า')}}visit('r');add('done','r',2.5,0,'ค้นหาครบทุกกิ่งแล้ว');let total=0;beats.forEach(b=>{b.start=total;total+=b.seconds;b.end=total});
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>1-(1-clamp(v))**3;function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function txt(v,x,y,font,color,align='left',a=1){g.save();g.globalAlpha=a;g.fillStyle=color;g.font=font;g.textAlign=align;g.textBaseline='middle';g.fillText(v,x,y);g.restore()}function ln(x1,y1,x2,y2,color,a=1,w=1){g.save();g.globalAlpha=a;g.strokeStyle=color;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore()}function state(t){let i=beats.findIndex(b=>t<b.end);if(i<0)i=beats.length-1;return{beat:beats[i],shot:shots[i]}}
function tree(s){const b=s.beat,shot=s.shot,cur=nodes[b.id];for(const n of Object.values(nodes)){if(!n.parent||!shot.seen.has(n.id))continue;const p=nodes[n.parent],hot=n.id===cur.id&&b.kind==='call';ln(p.x,p.y+28,n.x,n.y-28,hot?C.purple:C.edge,hot?.95:.75,hot?3:1.5)}for(const n of Object.values(nodes)){if(!shot.seen.has(n.id))continue;const active=n.id===cur.id,printed=active&&b.kind==='print';g.save();rr(n.x-47,n.y-27,94,54,8);g.fillStyle=active?(printed?'#153225':'#241d39'):C.panel;g.fill();g.strokeStyle=active?(printed?C.ok:C.purple):C.line;g.lineWidth=active?2:1;g.stroke();txt(`solve(${n.d})`,n.x,n.y-7,'600 13px ui-monospace,monospace',active?C.text:C.muted,'center');txt(n.d===0?'เริ่ม':n.branch,n.x,n.y+13,'500 11px system-ui',active?(printed?C.ok:'#c4b5fd'):C.faint,'center');g.restore()}for(let d=0;d<=set.length;d++)txt(`ชั้น ${d}`,500,132+d*106,'500 11px system-ui',C.faint,'right')}
const code=['void solve(int i, int sum)','{','    if (i == n)','    {','        if (sum == target)','            print_subset();','        return ;','    }','','    pick[i] = set[i];','    solve(i + 1, sum + set[i]);','    solve(i + 1, sum);','}'];function codePanel(s){const x=928,y=88,w=306,h=360,lh=23;rr(x,y,w,h,10);g.fillStyle=C.code;g.fill();g.strokeStyle=C.line;g.stroke();txt('powerset.c',x+18,y+24,'600 14px ui-monospace,monospace',C.text);code.forEach((src,i)=>{const py=y+58+i*lh,hot=s.beat.line===i+1;if(hot){rr(x+9,py-10,w-18,20,4);g.fillStyle=C.hot;g.fill()}txt(i+1,x+30,py,'500 11px ui-monospace,monospace',hot?C.muted:C.faint,'right');txt(src,x+46,py,'500 13px ui-monospace,monospace',hot?C.text:C.muted)})}function stdout(s){const x=928,y=470,w=306,h=146;rr(x,y,w,h,10);g.fillStyle='#0f1613';g.fill();g.strokeStyle='#26352e';g.stroke();txt('stdout',x+18,y+23,'600 13px ui-monospace,monospace',C.ok);const active=s.beat.kind==='print'?nodes[s.beat.id].pick.join(' '):null,lines=[...s.shot.output];if(active&&!lines.includes(active))lines.push(active);if(!lines.length)txt('(ยังไม่มี print)',x+18,y+55,'500 13px ui-monospace,monospace',C.faint);lines.forEach((v,i)=>txt(v,x+18,y+56+i*25,'600 15px ui-monospace,monospace',C.ok))}
function draw(t){const s=state(t);g.fillStyle=C.bg;g.fillRect(0,0,W,H);txt('powerset · backtracking',52,54,'700 26px ui-monospace,monospace',C.text);txt('$ ./powerset 3 1 2 3',52,82,'500 15px ui-monospace,monospace',C.muted);txt('ซ้าย = เลือก · ขวา = ข้าม · โหนดม่วง = ฟังก์ชันที่กำลังทำงาน',52,684,'500 13px system-ui',C.muted);tree(s);codePanel(s);stdout(s);rr(52,548,820,58,10);g.fillStyle=C.panel;g.fill();g.strokeStyle=C.line;g.stroke();txt(s.beat.note,75,577,'500 17px system-ui',s.beat.kind==='print'?C.ok:C.text);txt(`เวลา ${t.toFixed(1)} / ${total.toFixed(1)} วินาที`,872,684,'500 12px ui-monospace,monospace',C.faint,'right')}
let t=0,playing=true,last=performance.now();function toggle(){if(t>=total)t=0;playing=!playing;last=performance.now()}stage.addEventListener('click',e=>{if(!e.target.closest('button'))toggle()});document.getElementById('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen?.()});addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();toggle()}if(e.key==='ArrowRight')t=Math.min(total,t+5);if(e.key==='ArrowLeft')t=Math.max(0,t-5)});function frame(now){if(playing){t+=(now-last)/1000;if(t>=total){t=total;playing=false}}last=now;draw(t);if(!playing&&t<total){g.save();g.fillStyle='#13161ce8';g.beginPath();g.arc(W/2,H/2,34,0,Math.PI*2);g.fill();g.fillStyle=C.text;g.beginPath();g.moveTo(W/2-7,H/2-13);g.lineTo(W/2-7,H/2+13);g.lineTo(W/2+15,H/2);g.fill();g.restore()}prog.style.width=`${t/total*100}%`;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
